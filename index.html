<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokeiiiii</title>
    <link rel="icon" type="image/png" href="pokemon.jpg">
    <link rel="stylesheet" href="Fetch.css">
</head>

<body>
    <div class="header">
        <h1>Pokemon Fetch API</h1>
        <p class="subtitle">Enter a Pokémon name to reveal its battle-type power like a game HUD.</p>
        <input type="text" id="pokemonName" placeholder="Enter pokemon Name" class="pokemon-input">
        <button onclick="fetchDATA();" class="fetch-button">Fetch Pokemon</button><br>
        <div id="message" class="message" style="display:none;" aria-live="polite"></div>

        <div class="pokemonCard">
            <img src="" alt="Pokemon sprite" id="pokemonSprite" style="display: none;">
            <div class="power-info">
                <a id="power" class="type-badge" href="#" target="_blank" rel="noopener noreferrer"></a>
                <div id="powerLabel" class="power-label">power</div>
            </div>
        </div>
    </div>
    <script src="Fetch.js"></script>
</body>

</html>
